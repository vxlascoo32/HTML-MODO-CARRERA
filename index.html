<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Táctica de Juego</title>
  <style>
    /* Estructura general de la cancha */
    .pitch {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 620px;
      background-color: #1a3c27;
      background-image: repeating-linear-gradient(
        0deg,
        #1a3c27,
        #1a3c27 60px,
        #143220 60px,
        #143220 120px
      );
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      margin: 0 auto;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Dibujo del terreno de juego */
    .area-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 90px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top: none;
    }

    .area-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 90px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-bottom: none;
    }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 140px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
    }

    /* Ficha del jugador (Posición + Select) */
    .player-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Mantiene la ficha centrada exactamante sobre las coordenadas left/top */
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    /* Etiqueta dorada de la posición */
    .position-badge {
      background-color: #cda85f;
      color: #0c1810;
      font-weight: 800;
      font-size: 0.65rem;
      padding: 1px 7px;
      border-radius: 8px;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Desplegable con ancho corregido */
    .player-select {
      min-width: 135px;           /* Incrementado para permitir nombres largos */
      max-width: 160px;           /* Límite para evitar choques en líneas pobladas */
      width: max-content;
      background-color: #0d2116;
      color: #ffffff;
      border: 1.5px solid #cda85f;
      border-radius: 6px;
      padding: 3px 20px 3px 8px;  /* Espacio reservado a la derecha para la flecha */
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .player-select:focus {
      border-color: #ffffff;
      box-shadow: 0 0 6px rgba(205, 168, 95, 0.6);
    }

    /* Ubicaciones de cada posición (% de la cancha) */
    .pos-dc    { top: 12%; left: 50%; }

    .pos-mco-l { top: 29%; left: 20%; }
    .pos-mco-c { top: 25%; left: 50%; }
    .pos-mco-r { top: 29%; left: 80%; }

    .pos-mcd-l { top: 52%; left: 36%; }
    .pos-mcd-r { top: 52%; left: 64%; }

    .pos-li    { top: 71%; left: 14%; }
    .pos-dfc-l { top: 74%; left: 38%; }
    .pos-dfc-r { top: 74%; left: 62%; }
    .pos-ld    { top: 71%; left: 86%; }

    .pos-por   { top: 90%; left: 50%; }
  </style>
</head>
<body>

  <div class="pitch">
    <div class="area-top"></div>
    <div class="center-circle"></div>
    <div class="area-bottom"></div>

    <!-- DC -->
    <div class="player-node pos-dc">
      <span class="position-badge">DC</span>
      <select class="player-select">
        <option>José Manuel</option>
      </select>
    </div>

    <!-- MCOs -->
    <div class="player-node pos-mco-l">
      <span class="position-badge">MCO</span>
      <select class="player-select">
        <option>Josias Palma</option>
      </select>
    </div>
    <div class="player-node pos-mco-c">
      <span class="position-badge">MCO</span>
      <select class="player-select">
        <option>Agustin Delgado</option>
      </select>
    </div>
    <div class="player-node pos-mco-r">
      <span class="position-badge">MCO</span>
      <select class="player-select">
        <option>Cristian Cruz</option>
      </select>
    </div>

    <!-- MCDs -->
    <div class="player-node pos-mcd-l">
      <span class="position-badge">MCD</span>
      <select class="player-select">
        <option>Patrik Mendoza</option>
      </select>
    </div>
    <div class="player-node pos-mcd-r">
      <span class="position-badge">MCD</span>
      <select class="player-select">
        <option>Fabricio Acosta</option>
      </select>
    </div>

    <!-- Defensas -->
    <div class="player-node pos-li">
      <span class="position-badge">LI</span>
      <select class="player-select">
        <option>Lautaro de la Cruz</option>
      </select>
    </div>
    <div class="player-node pos-dfc-l">
      <span class="position-badge">DFC</span>
      <select class="player-select">
        <option>Gonzalo Benítez</option>
      </select>
    </div>
    <div class="player-node pos-dfc-r">
      <span class="position-badge">DFC</span>
      <select class="player-select">
        <option>Juan Arraya</option>
      </select>
    </div>
    <div class="player-node pos-ld">
      <span class="position-badge">LD</span>
      <select class="player-select">
        <option>Maximilian Schmidt</option>
      </select>
    </div>

    <!-- POR -->
    <div class="player-node pos-por">
      <span class="position-badge">POR</span>
      <select class="player-select">
        <option>Francisco</option>
      </select>
    </div>
  </div>

</body>
</html>
